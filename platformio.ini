; Naam Jap Counter - INMP441 mic + 1.8" ST7735 TFT, two supported boards:
;   esp32-s3-n16r8  ESP32-S3-DevKitC-1 N16R8   (use the "UART" USB-C port)
;   esp32dev        ESP32 DevKit V1 / WROOM-32
; Pick the board in the PlatformIO toolbar (env switcher), or on the CLI:
;   pio run -e esp32dev -t upload        pio run -e esp32-s3-n16r8 -t upload
; Pin maps are in include/config.h.

[platformio]
default_envs = esp32-s3-n16r8

[common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/gzip_pages.py
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

[env:esp32-s3-n16r8]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board = esp32-s3-devkitc-1
; N16R8 = 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_ESP32_S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
board = esp32dev
; CH340 USB chips on many DevKit V1 boards drop out at 921600 baud
upload_speed = 460800
; 4 MB flash: 1.25 MB app, 1.4 MB LittleFS (history + voices)
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_ESP32_DEVKIT
    -DCORE_DEBUG_LEVEL=1
